# PlantDiseaseAI - Tomato Crop Configuration
# Inherits from configs/base.yaml

crop:
  name: tomato
  display_name: Tomato
  dataset_source: PlantVillage (Original)
  total_images: 18160

paths:
  dataset_root: Dataset/datasets/tomato
  raw: Dataset/datasets/tomato/raw
  processed: Dataset/datasets/tomato/processed
  train: Dataset/datasets/tomato/balanced_train
  val: Dataset/datasets/tomato/split/val
  test: Dataset/datasets/tomato/split/test
  class_weights_source: Dataset/datasets/tomato/split/train
  reports: Dataset/datasets/tomato/reports
  model_dir: Models/models/tomato

classes:
  - id: 0
    folder_name: Tomato___Bacterial_spot
    display_name: Bacterial Spot
    slug: bacterial_spot
  - id: 1
    folder_name: Tomato___Early_blight
    display_name: Early Blight
    slug: early_blight
  - id: 2
    folder_name: Tomato___healthy
    display_name: Healthy
    slug: healthy
  - id: 3
    folder_name: Tomato___Late_blight
    display_name: Late Blight
    slug: late_blight
  - id: 4
    folder_name: Tomato___Leaf_Mold
    display_name: Leaf Mold
    slug: leaf_mold
  - id: 5
    folder_name: Tomato___Septoria_leaf_spot
    display_name: Septoria Leaf Spot
    slug: septoria_leaf_spot
  - id: 6
    folder_name: Tomato___Spider_mites Two-spotted_spider_mite
    display_name: Spider Mites (Two-spotted Spider Mite)
    slug: spider_mites
  - id: 7
    folder_name: Tomato___Target_Spot
    display_name: Target Spot
    slug: target_spot
  - id: 8
    folder_name: Tomato___Tomato_mosaic_virus
    display_name: Tomato Mosaic Virus
    slug: tomato_mosaic_virus
  - id: 9
    folder_name: Tomato___Tomato_Yellow_Leaf_Curl_Virus
    display_name: Tomato Yellow Leaf Curl Virus
    slug: tomato_yellow_leaf_curl_virus

class_aliases: {}

training:
  model_name: efficientnet_b0
  num_epochs: 50
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  image_size: 256
  mixed_precision: true
  gradient_clip_norm: 1.0
  pin_memory: true
  persistent_workers: true
  use_class_weights: true
  class_weights_from_original_train: true
  early_stopping:
    enabled: true
    patience: 8
    min_delta: 0.001
    monitor: val_loss
    mode: min
  scheduler:
    name: cosine
    warmup_epochs: 0
    min_lr: 0.00001

evaluation:
  output_dir: Outputs/Tomato

export:
  output_dir: Outputs/exports/tomato
  model_name_prefix: tomato_disease

inference:
  weights_path: Models/weights/tomato/best_model.pth
  class_names_path: Dataset/datasets/tomato/reports/class_mapping.json
  image_size: 256
  num_classes: 10
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

desktop_app:
  title: PlantDiseaseAI - Tomato Disease Detection
  crop: tomato
